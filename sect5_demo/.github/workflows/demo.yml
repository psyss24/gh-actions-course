name: Deploy website
on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Lint code
        run: npm run lint
      - name: Test code
        run: npm run test
  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      script-file: ${{ steps.publish.outputs.script-file }}
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build
      - name: publish js filname
        id: publish
        run: find sect5_demo/dist/assets/*.js -type f -execdir echo '{}' >> $GITHUB_OUTPUT ';'
      - name: upload artifacts
        uses: actions/upload-artifact@v3
        with: 
            name: dist-files
            path: sect5_demo/dist
      
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: download build files
        uses: actions/download-artifact@v3
        with:
          name: dist-files
      - name: output filename
        run: echo {{$needs.builds.output.script-file}}
      - name: Deploy
        run: echo "Deploying..."
