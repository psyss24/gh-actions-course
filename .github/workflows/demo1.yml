name: Events Demo 1
on: [push, workflow_dispatch]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Output event data
        run: echo "${{ toJSON(github.event) }}"
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
        working-directory: mod4_demo
      - name: Test code
        run: npm run test
        working-directory: mod4_demo
      - name: Build code
        run: npm run build
        working-directory: mod4_demo
      - name: Deploy project
        run: echo "Deploying..."