name: Deploy website
on:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: deps-node-modules-${{hashFiles('sect5_demo/package.json')}}
      - name: Install dependencies
        run: npm ci
        working-directory: ./sect5_demo
      - name: Lint code
        run: npm run lint
        working-directory: ./sect5_demo
      - name: Test code
        run: npm run test
        working-directory: ./sect5_demo
  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      script-file: ${{ steps.publish.outputs.script-file }}
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: deps-node-modules-${{hashFiles('sect5_demo/package.json')}}
      - name: Install dependencies
        run: npm ci
        working-directory: ./sect5_demo
      - name: Build website
        run: npm run build
        working-directory: ./sect5_demo
      - name: publish js filname
        id: publish
        run: echo "script-file=$(find sect5_demo/dist/assets/*.js -type f)" >> $GITHUB_OUTPUT
        # run: find sect5_demo/dist/assets/*.js -type f -execdir echo '{}' >> $GITHUB_OUTPUT ';'
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with: 
            name: dist-files
            path: ./sect5_demo/dist
      
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: download build files
        uses: actions/download-artifact@v4
        with:
          name: dist-files
      - name: output filename
        run: echo {{ $needs.build.outputs.script-file }}
      - name: Deploy
        run: echo "Deploying..."
