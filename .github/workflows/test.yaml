name: Test 
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: get code
        uses: actions/checkout@v3
      - name: install nodejs
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: install dependancies
        run: npm install
        working-directory: ./sect3_demo
      - name: run tests
        run: npm test
        working-directory: ./sect3_demo
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: get code
        uses: actions/checkout@v3
      - name: install nodejs
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: install dependancies
        run: npm install
        working-directory: ./sect3_demo
      - name: build project
        run: npm run build
        working-directory: ./sect3_demo
      - name: deploy
        run: echo deploy
