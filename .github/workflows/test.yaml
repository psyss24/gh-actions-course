name: Test 
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: get code
        uses: actions/checkout@v3
      - name: install nodejs
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: install dependancies
        run: npm install
        working-directory: ./app
      - name: run tests
        run: npm test
        working-directory: ./app
  deploy:
    runs-on: ubuntu-latest
    jobs:
      - name: get code
        uses: actions/checkout@v3
      - name: install nodejs
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: install dependancies
        run: npm install
      - name: build project
        run: npm run build
      - name: deploy
        run: echo deploy
